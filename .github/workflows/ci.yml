name: Full Stack CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend API & Scheduler Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Integration Test Suite
        env:
          GROQ_API_KEY: mock_key_for_testing
          JWT_SECRET: ci_secret_key_testing_12345
        run: |
          python -m unittest tests/test_full_suite.py

  frontend-tests:
    name: Flutter Luxury Client Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: flutter pub get

      - name: Static Code Analysis
        working-directory: ./frontend
        run: flutter analyze

      - name: Widget & Unit Tests
        working-directory: ./frontend
        run: flutter test
